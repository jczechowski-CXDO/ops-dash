<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crexendo IT · Service operations</title>
    <!-- default-src 'self' makes the zero-external-dependency rule enforceable by
         the BROWSER rather than by a grep and good intentions. The day someone
         re-adds a Google Fonts @import or a CDN script, the browser refuses it.
         That value is the same whether the app is local-only or deployed.
         Note frame-ancestors is ignored in a meta CSP — it needs an HTTP header,
         and is on the Reopens-at-release list rather than here. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/aurora/styles.css" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
